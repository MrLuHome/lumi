[package]
name = "lumi-retouch"
version = "0.1.0"
description = "LUMI RETOUCH · 专业 AI 人像修图桌面应用"
authors = ["LUMI"]
edition = "2021"
rust-version = "1.87"

[lib]
name = "lumi_retouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["raw"]
# 正式包默认包含 RAW；1.0 Beta 用 `--no-default-features` 构建不含 LibRaw 的发行包，
# 直到 LibRaw 的 LGPL 分发审核完成。
raw = ["dep:libraw_rs_vendor"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
base64 = "0.22"
rfd = "0.15"
rayon = "1.10"
thiserror = "2"
tract-onnx = "0.23"
sha2 = "0.10"
libraw_rs_vendor = { version = "1.0.0", optional = true }
lcms2 = { version = "6.3.0", features = ["static"] }
wgpu = "30.0.2"
pollster = "0.4"
flate2 = "1"
tiff = "0.9"
bytemuck = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
