[package]
name = "lumi-retouch"
version = "0.1.0"
description = "LUMI RETOUCH · 专业 AI 人像修图桌面应用"
authors = ["LUMI"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "lumi_retouch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.22"
rfd = "0.15"
rayon = "1.10"
thiserror = "2"
tract-onnx = "0.23"
sha2 = "0.10"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
